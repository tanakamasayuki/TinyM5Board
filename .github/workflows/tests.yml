name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap and sequential: nothing here builds a sketch.
  catalogue:
    runs-on: ubuntu-latest
    outputs:
      families: ${{ steps.list.outputs.families }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # A stale generated header would make every other job test the
      # wrong thing, so this gates them.
      - name: Generated files are current
        run: python3 tools/gen_boards.py --check

      - id: list
        run: echo "families=$(python3 tools/gen_boards.py --families)" >> "$GITHUB_OUTPUT"

  # The classes that are not per board - the button state machine so far.
  # Deliberately not behind the catalogue gate: nothing here is
  # generated, and one fast job that always reports is worth having when
  # the matrix below takes minutes.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v5

      - name: Install test dependencies
        working-directory: tests
        run: uv sync

      - name: Run unit tests
        working-directory: tests
        run: uv run pytest unit -v -s --profile host

  # Tier 0: every board header, compiled by the toolchain that ships the
  # code. The begin() goldens run on the host core, so this is the only
  # job that sees the real compiler - and the only one that pays for the
  # esp32 core, which the profile downloads rather than `core install`
  # (D29). About a minute and a half of compiling on top of that.
  tier0:
    needs: catalogue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v5

      - name: Install test dependencies
        working-directory: tests
        run: uv sync

      - name: Compile every board header
        working-directory: tests
        run: uv run pytest tier0 -v

  # Tier 2: the examples, built as a reader would build them. Same core
  # as tier0 and only four sketches, so it rides along as its own quick
  # job rather than waiting on the catalogue gate - nothing here is
  # generated.
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v5

      - name: Install test dependencies
        working-directory: tests
        run: uv sync

      - name: Build every example
        working-directory: tests
        run: uv run pytest tier2 -v

  # One job per board family. Each begin() test builds and runs its own
  # sketch, so the wall clock grows with the catalogue; splitting on the
  # family keeps it flat and makes a failure read as "Stick broke"
  # rather than as one red tick among sixty.
  begin:
    needs: catalogue
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        family: ${{ fromJson(needs.catalogue.outputs.families) }}
    name: begin (${{ matrix.family }})
    steps:
      - uses: actions/checkout@v4

      - name: Setup arduino-cli
        uses: arduino/setup-arduino-cli@v2

      # No `core install` here on purpose. Every sketch.yaml pins the
      # platform version, and `--profile` installs exactly that, isolated
      # per version under ~/.arduino15/internal/. A core that moves
      # underneath us cannot change a result silently.
      # (docs/DECISIONS.ja.md D29)

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v5

      - name: Install test dependencies
        working-directory: tests
        run: uv sync

      - name: Run begin() goldens
        working-directory: tests
        run: >
          uv run pytest "begin/${{ matrix.family }}" -v -s --profile host
          --html="report-${{ matrix.family }}.html" --self-contained-html

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.family }}
          path: |
            tests/report-*.html
            tests/**/output/**
          if-no-files-found: ignore
