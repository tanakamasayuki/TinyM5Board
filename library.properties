name=TinyM5Board
version=0.0.0
author=TANAKA Masayuki
maintainer=TANAKA Masayuki
sentence=Board support for M5Stack boards, without pulling in a graphics library.
paragraph=Brings up an M5 board and hands you its pinout: power rails, display reset, backlight, battery and buttons, with the board fixed at build time. The same sketch moves to another board by changing one include, and a board with no screen costs no graphics library at all. Header-only, so anything you do not include is never compiled.
category=Device Control
url=https://github.com/tanakamasayuki/TinyM5Board
architectures=esp32,host
includes=TinyM5Board.h
